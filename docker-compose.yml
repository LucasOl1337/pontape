# Rede Alimenta local: Postgres + API + painel, com seed de EXEMPLO e login local de teste.
# Na raiz do repositório:  docker compose up --build
# API e Swagger: http://localhost:8000/docs · Painel: http://localhost:8501
name: rede-alimenta

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alimenta
      POSTGRES_PASSWORD: alimenta  # só local; produção usa DATABASE_URL do Supabase
      POSTGRES_DB: alimenta
    volumes:
      - alimenta-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alimenta -d alimenta"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: alimenta/Dockerfile
    image: rede-alimenta:local
    environment:
      DATABASE_URL: postgresql+psycopg://alimenta:alimenta@db:5432/alimenta
      ALIMENTA_ENV: local  # só aqui: seed de exemplo e login sem e-mail para contas de teste
      ALIMENTA_SEED_ON_START: "true"
      ALIMENTA_TEST_EMAILS: "@teste.alimenta"
      ALIMENTA_OPERATOR_EMAILS: operador@teste.alimenta
      ALIMENTA_OPS_TOKEN: ${ALIMENTA_OPS_TOKEN:-troque-este-token-local}
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  painel:
    image: rede-alimenta:local
    command: ["alimenta/painel/run.sh"]
    environment:
      ALIMENTA_API_URL: http://api:8000
      ALIMENTA_PUBLIC_API_URL: http://localhost:8000
      ALIMENTA_GITHUB_REPO: LucasOl1337/pontape
      PORT: "8501"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  alimenta-db:
