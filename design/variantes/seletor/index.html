<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PontaPé · seletor de variantes</title>
<style>
  :root { --bar: #111318; --ink: #f4f1ea; --muted: #9aa0ab; --line: #2a2e37; --on: #ffd23f; --ok: #3ddc84; --off: #ff5a4f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bar); color: var(--ink); font: 15px/1.3 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  h1 span { color: var(--muted); font-weight: 500; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; }
  button { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; text-align: left; }
  button:hover { background: #1d2029; }
  button[aria-pressed="true"] { background: var(--on); color: #111; }
  button:focus-visible { outline: 3px solid var(--on); outline-offset: 2px; }
  kbd { font: 12px ui-monospace, monospace; padding: 1px 5px; border: 1px solid currentColor; border-radius: 4px; opacity: .7; }
  .name { font-weight: 700; }
  .model { display: block; font-size: 12px; opacity: .75; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.off { background: var(--off); }
  .tools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  a { color: var(--ink); }
  .hint { color: var(--muted); font-size: 12px; }
  main { position: relative; flex: 1; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .down { position: absolute; inset: 0; display: none; place-content: center; text-align: center; padding: 24px; color: var(--muted); }
  .down.show { display: grid; }
  .down strong { display: block; color: var(--ink); font-size: 20px; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>PontaPé <span>· variantes</span></h1>
  <div class="group" role="group" aria-label="Variante" id="variants"></div>
  <div class="group" role="group" aria-label="Rodada" id="rounds"></div>
  <div class="group" role="group" aria-label="Página" id="pages"></div>
  <div class="tools">
    <a id="newtab" href="#" target="_blank" rel="noopener">abrir em aba própria</a>
    <span class="hint">teclas <kbd>1</kbd>–<kbd>6</kbd> ou <kbd>←</kbd> <kbd>→</kbd> · <kbd>L</kbd> home/livro · <kbd>R</kbd> rodada</span>
  </div>
</header>
<main>
  <iframe id="view" title="Variante selecionada"></iframe>
  <div class="down" id="down"><div><strong>Essa variante ainda não está no ar.</strong>O agente dela ainda está trabalhando, ou o servidor caiu. Tente de novo daqui a pouco.</div></div>
</main>
<script>
  const VARIANTS = [
    { id: 'atual', name: 'Atual', model: 'v1 · Design/UI', ports: [4340, 4340] },
    { id: 'prisma', name: 'Prisma', model: 'Opus 5.5 · premium', ports: [4351, 4341] },
    { id: 'cronica', name: 'Crônica', model: 'Opus 5.5 · editorial', ports: [4352, 4342] },
    { id: 'abaco', name: 'Ábaco', model: 'Opus 5.5 · dados', ports: [4353, 4343] },
    { id: 'maracatu', name: 'Maracatu', model: 'GPT-6-Astra · pop', ports: [4354, 4344] },
    { id: 'pluma', name: 'Pluma', model: 'GPT-6-Sol · mínimo', ports: [4355, 4345] },
  ];
  const ROUNDS = [{ id: 'r1', name: 'Rodada 1' }, { id: 'r2', name: 'Rodada 2 · escada' }];
  const PAGES = [{ id: 'home', name: 'Home', path: '/' }, { id: 'livro', name: 'Livro', path: '/transparencia' }];
  const params = new URLSearchParams(location.search);
  let current = Math.max(0, VARIANTS.findIndex(v => v.id === params.get('v')));
  let page = Math.max(0, PAGES.findIndex(p => p.id === params.get('p')));
  let round = params.get('r') === 'r1' ? 0 : 1;
  const status = {};
  const $ = id => document.getElementById(id);

  const portOf = (v, r = round) => v.ports[r];
  const urlOf = (v, p) => `http://${location.hostname}:${portOf(v)}${p.path}`;
  const key = (v, r = round) => `${v.id}:${r}`;

  function render() {
    $('variants').innerHTML = VARIANTS.map((v, i) => `
      <button type="button" data-v="${i}" aria-pressed="${i === current}">
        <span class="dot ${status[key(v)] || ''}" aria-hidden="true"></span>
        <span><span class="name">${v.name}</span><span class="model">${v.model}</span></span>
        <kbd>${i + 1}</kbd>
      </button>`).join('');
    $('pages').innerHTML = PAGES.map((p, i) => `<button type="button" data-p="${i}" aria-pressed="${i === page}">${p.name}</button>`).join('');
    $('rounds').innerHTML = ROUNDS.map((r, i) => `<button type="button" data-r="${i}" aria-pressed="${i === round}">${r.name}</button>`).join('');
  }

  function show() {
    const v = VARIANTS[current], p = PAGES[page];
    const url = urlOf(v, p);
    $('newtab').href = url;
    $('down').classList.toggle('show', status[key(v)] === 'off');
    if ($('view').dataset.src !== url) { $('view').dataset.src = url; $('view').src = url; }
    history.replaceState(null, '', `?v=${v.id}&p=${p.id}&r=${ROUNDS[round].id}`);
    document.title = `${v.name} · ${ROUNDS[round].id.toUpperCase()} · ${p.name} · PontaPé`;
    render();
  }

  async function probe() {
    await Promise.all(VARIANTS.flatMap(v => [0, 1].map(async r => {
      try { await fetch(`http://${location.hostname}:${portOf(v, r)}/`, { mode: 'no-cors', cache: 'no-store' }); status[key(v, r)] = 'ok'; }
      catch { status[key(v, r)] = 'off'; }
    })));
    show();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) current = +b.dataset.v;
    if (b.dataset.p) page = +b.dataset.p;
    if (b.dataset.r) round = +b.dataset.r;
    show();
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[1-6]$/.test(e.key)) current = +e.key - 1;
    else if (e.key === 'ArrowRight') current = (current + 1) % VARIANTS.length;
    else if (e.key === 'ArrowLeft') current = (current - 1 + VARIANTS.length) % VARIANTS.length;
    else if (e.key.toLowerCase() === 'l') page = (page + 1) % PAGES.length;
    else if (e.key.toLowerCase() === 'r') round = (round + 1) % ROUNDS.length;
    else return;
    e.preventDefault(); show();
  });
  $('view').addEventListener('load', () => $('view').blur());

  render(); show(); probe(); setInterval(probe, 15000);
</script>
</body>
</html>
