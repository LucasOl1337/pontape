name: Livro de ações do projeto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ledger-project-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'LucasOl1337/pontape' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reconciliar o projeto e carimbar a cabeça
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_SIGNING_PKCS8: ${{ secrets.LEDGER_SIGNING_PKCS8 }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            # Only this disposable Actions checkout is reset between attempts.
            # Recompute from new main; never rebase an already-hashed ledger.
            git switch -C ledger-project-sync origin/main
            npm ci
            npm run ledger:sync-project -- --apply
            npm run ledger:verify
            ledger_changed=no
            if ! git diff --quiet -- src/data/ledger/ledger.json; then
              ledger_changed=yes
            fi
            behind=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const trust = JSON.parse(readFileSync("src/data/ledger/trust.json", "utf8"));
              const ledger = JSON.parse(readFileSync("src/data/ledger/ledger.json", "utf8"));
              const through = trust.signedThrough ? Number(trust.signedThrough) : 0;
              console.log(through < Number(ledger.checkpoint.sequence) ? "yes" : "no");
            ')
            if [ "$ledger_changed" = no ] && [ "$behind" = no ]; then
              echo 'Cabeça já carimbada. Sem commit.'
              exit 0
            fi
            # Same push as the new actions, so the seal does not wait for the next day.
            npm run ledger:stamp -- --apply
            if ! git diff --quiet -- src/data/ledger/intake.json; then
              echo 'O carimbo alterou a fila. A main foi preservada.' >&2
              exit 1
            fi
            npm run check
            git add -- src/data/ledger/ledger.json src/data/ledger/trust.json src/data/ledger/checkpoint-signed.json
            if git diff --cached --quiet; then
              echo 'Nada novo. Sem commit.'
              exit 0
            fi
            git diff --cached --name-only | while IFS= read -r path; do
              case "$path" in
                src/data/ledger/ledger.json|src/data/ledger/trust.json|src/data/ledger/checkpoint-signed.json) ;;
                *) echo "Arquivo inesperado: $path" >&2; exit 1 ;;
              esac
            done
            if [ "$ledger_changed" = yes ]; then
              commit_message='Registra ações do projeto e carimba a cabeça [ledger-bot]'
            else
              commit_message='Carimba a cabeça do livro [ledger-bot]'
            fi
            git commit -m "$commit_message"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            echo "Push recusado na tentativa $attempt; reconciliando novamente sem force."
          done
          echo 'Não foi possível gravar. Main foi preservada; reexecute o workflow após conferir a causa.' >&2
          exit 1
