name: Escrevente do livro

on:
  schedule:
    # 12:15 em São Paulo. Sem evento: só carimba o checkpoint que já está no livro.
    - cron: '15 15 * * *'
  workflow_dispatch:
    inputs:
      event:
        description: 'Envelope JSON (source, eventId, payload). Vazio carimba o checkpoint atual, sem ação nova.'
        required: false
        type: string

permissions: {}

concurrency:
  group: ledger-ingest
  cancel-in-progress: false

jobs:
  write:
    if: github.repository == 'LucasOl1337/pontape' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Gravar ou carimbar
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_SIGNING_PKCS8: ${{ secrets.LEDGER_SIGNING_PKCS8 }}
          INGEST_EVENT: ${{ inputs.event }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git switch -C ledger-ingest origin/main
            npm ci
            if [ -z "${INGEST_EVENT//[[:space:]]/}" ]; then
              npm run ledger:stamp -- --apply
              git add -- src/data/ledger/trust.json src/data/ledger/checkpoint-signed.json
              if [ -n "$(git status --porcelain -- src/data/ledger/ledger.json src/data/ledger/intake.json)" ]; then
                echo 'O carimbo alterou o livro. A main foi preservada.' >&2
                exit 1
              fi
              commit_message='Carimba o checkpoint do livro [ledger-bot]'
            else
              npm run ledger:drain -- --event-json "$INGEST_EVENT" --apply
              git add -- src/data/ledger/ledger.json src/data/ledger/intake.json src/data/ledger/trust.json src/data/ledger/checkpoint-signed.json
              commit_message='Registra evento no livro [ledger-bot]'
            fi
            if git diff --cached --quiet; then
              echo 'Nada novo. Sem commit.'
              exit 0
            fi
            git diff --cached --name-only | while IFS= read -r path; do
              case "$path" in
                src/data/ledger/ledger.json|src/data/ledger/intake.json|src/data/ledger/trust.json|src/data/ledger/checkpoint-signed.json) ;;
                *) echo "Arquivo inesperado: $path" >&2; exit 1 ;;
              esac
            done
            if [ -z "${INGEST_EVENT//[[:space:]]/}" ]; then
              git diff --cached --name-only | while IFS= read -r path; do
                case "$path" in
                  src/data/ledger/trust.json|src/data/ledger/checkpoint-signed.json) ;;
                  *) echo "O carimbo só pode gravar confiança e assinatura: $path" >&2; exit 1 ;;
                esac
              done
            fi
            npm run ledger:verify
            npm run check
            git commit -m "$commit_message"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            echo "Push recusado na tentativa $attempt; tentando de novo sem force."
          done
          echo 'Não foi possível gravar. A main foi preservada.' >&2
          exit 1
