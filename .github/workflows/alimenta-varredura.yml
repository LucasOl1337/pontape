name: Rede Alimenta · varredura

# A cada 30 minutos, das 7h às 22h de São Paulo (10h–01h UTC), POST /ops/sweep: vence doações (sem destino na
# validade; com destino 48 h depois), confirma e reenvia a fila do livro público, ressincroniza o catálogo e
# tenta de novo apagar logins pendentes. O token só serve para essa rota.
# Segredos: ALIMENTA_API_URL e ALIMENTA_OPS_TOKEN (o mesmo valor da env da API no Render).
# Fora do horário, a varredura só acontece quando alguém abre o sistema (Render free: 750 h/mês
# para o workspace inteiro). Sem segredo, o job termina verde e avisa. O GitHub pode atrasar agendamentos; a API também
# manda cada ação para o livro na hora em que ela acontece, então o atraso só adia a próxima ação de uma doação.
on:
  schedule:
    - cron: '*/30 10-23 * * *'
    - cron: '0,30 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: alimenta-varredura
  cancel-in-progress: false

jobs:
  sweep:
    if: github.repository == 'LucasOl1337/pontape'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /ops/sweep
        env:
          API_URL: ${{ secrets.ALIMENTA_API_URL }}
          OPS_TOKEN: ${{ secrets.ALIMENTA_OPS_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$OPS_TOKEN" ]; then
            echo "Varredura não executada: segredos ALIMENTA_API_URL/ALIMENTA_OPS_TOKEN ausentes." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # O plano free do Render dorme: a primeira chamada pode levar ~1 min.
          body=$(curl -sS -f --retry 3 --retry-delay 20 --max-time 90 -X POST \
            -H "X-Alimenta-Ops-Token: $OPS_TOKEN" "${API_URL%/}/ops/sweep")
          echo "Varredura: $body" | tee -a "$GITHUB_STEP_SUMMARY"
